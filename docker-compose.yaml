services:
  api:
    build:
      context: ./edu-connect-service
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    networks:
      - app-network
    env_file:
      - .env

  frontend:
    build:
      context: ./edu-connect-client
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      - api
    networks:
      - app-network
    env_file:
      - .env

networks:
  app-network:
    driver: bridge