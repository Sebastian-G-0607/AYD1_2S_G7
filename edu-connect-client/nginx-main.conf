# Fix PID file location for non-root user
pid /var/run/nginx/nginx.pid;

# Fix cache directory permissions
events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Security: hide nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_disable "MSIE [5-6]\.";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript application/x-font-woff2 application/font-woff application/font-ttf;

    # Cache for nginx internal operations
    client_body_temp_path  /var/cache/nginx/client_temp  1 2;
    proxy_temp_path      /var/cache/nginx/proxy_temp      1 2;
    fastcgi_temp_path    /var/cache/nginx/fastcgi_temp    1 2;
    uwsgi_temp_path      /var/cache/nginx/uwsgi_temp      1 2;
    scgi_temp_path       /var/cache/nginx/scgi_temp        1 2;

    # Include our server blocks
    include /etc/nginx/conf.d/*.conf;
}