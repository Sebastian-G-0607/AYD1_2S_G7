# Main server block for Vue.js application
server {
    # Listen on port 8080 (non-privileged port for non-root user)
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security: hide nginx version
    server_tokens off;

    # SPA Routing: Direct all unmatched requests to index.html
    # This supports Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets (Vite adds content hashes to filenames)
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Prevent caching of index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers for all responses
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sessions.bugsnag.com https://cdn.bugsnag.com; frame-src 'self' https://sessions.bugsnag.com; connect-src 'self' https://sessions.bugsnag.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Block access to hidden files (like .htaccess, .env, etc.)
    location ~ /\.(?!well-known\/) {
        deny all;
    }

    # Security: prevent access to source maps and sensitive files
    location ~* \.(map|bak|orig|dist)$ {
        deny all;
    }
}