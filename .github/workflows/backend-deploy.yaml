name: Backend Deploy to OCI

on:
  push:
    branches: [develop, main]
    paths:
      - 'edu-connect-service/**'
  workflow_dispatch:

jobs:
  build: ubuntu-latest
  steps:
    - uses: actions/checkout@v4 

    - name: Setup .NET
      uses: actions/setup-dotnet@v4                                                                                                                                                    
      with:                                                                                                                                                                            
        dotnet-version: '10.0.x'

    - name: Build Solution
      run: dotnet build edu-connect-service/edu-connect-service.slnx --configuration Release

  test: ubuntu-latest
  needs: [build]                                                                                                                                                                       
    runs-on: ubuntu-latest                                                                                                                                                               
    steps:                                                                                                                                                                               
      - uses: actions/checkout@v4                                                                                                                                                        

      - name: Setup .NET                                                                                                                                                                 
        uses: actions/setup-dotnet@v4                                                                                                                                                    
        with:                                                                                                                                                                            
          dotnet-version: '10.0.x'                                                                                                                                                       

      - name: Run Unit Tests                                                                                                                                                             
        run: dotnet test edu-connect-service/tests/edu-connect-service.Api.UnitTests/edu-connect-service.Api.UnitTests.csproj --configuration Release        

  release:
  needs: [test]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push
        run: |
          docker build -t ghcr.io/${{ env.REPO_LOWER }}-service:latest ./edu-connect-service
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ env.REPO_LOWER }}-service:latest

  build-and-deploy:
  need: [release]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/edu-connect-service
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            docker pull ghcr.io/${{ env.REPO_LOWER }}-service:latest
            docker compose up -d